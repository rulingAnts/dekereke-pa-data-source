name: tests

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run core library tests
        run: dotnet test src/DekerekeToPa.Tests -c Release --logger "console;verbosity=detailed"

  # Type-checks the add-on against the compile-only stubs in src/PaStubs and
  # src/SilToolsStubs (built from docs/pa-internals/api-surface.md), so PA-facing
  # compile breakage is caught without a PA install. A green build here proves
  # the add-on compiles against the documented surface - nothing about run-time
  # behaviour against real PA. Deliberately NO job downloads the PA installer;
  # building against real Pa.exe/SilTools.dll stays a manual, on-Windows step
  # (see HANDOFF.md, "Building the add-on without a PA install").
  addon-stub-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build add-on against API-surface stubs
        run: dotnet build src/PaDekereke -c Release -p:UseStubs=true
      # The two DLLs are architecture-neutral managed IL, so this Linux-built
      # output is exactly what gets installed into <PA>\AddOns\ on Windows.
      # Compiled against the stubs, so treat every artifact as untested against
      # real PA until the HANDOFF.md Windows checklist has been run with it.
      - name: Upload add-on build for manual testing
        uses: actions/upload-artifact@v4
        with:
          name: PaDekereke-addon-stub-build
          path: |
            src/PaDekereke/bin/Release/net48/PaDekereke.dll
            src/PaDekereke/bin/Release/net48/DekerekeToPa.dll
          if-no-files-found: error
